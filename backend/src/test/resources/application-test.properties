spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

seat.hold.ttl-seconds=120
seat.lock.timeout-ms=3000
seat.sweep.interval-ms=15000

logging.level.root=WARN
logging.level.org.springframework=WARN

# No real Redis server in tests: the StringRedisTemplate bean stays (lazy, never actually
# used unless a test triggers seat-event publishing), but skip the eager health ping.
management.health.redis.enabled=false

version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: seatres-mariadb-dev
    environment:
      MARIADB_DATABASE: seatres
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seatres-network

  db-init:
    image: mariadb:11
    container_name: seatres-db-init
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./init-db/init-demo.sql:/sql/init-demo.sql:ro
    command: ["sh", "-c", "mariadb -h mariadb -u root -proot seatres < /sql/init-demo.sql"]
    networks:
      - seatres-network

  redis:
    image: redis:7-alpine
    container_name: seatres-redis-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seatres-network

  backend-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: seatres-backend-1
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/seatres
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_APPLICATION_NAME: seatreservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seatres-network

  backend-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: seatres-backend-2
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/seatres
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_APPLICATION_NAME: seatreservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seatres-network

  nginx:
    image: nginx:1.27-alpine
    container_name: seatres-nginx-dev
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    networks:
      - seatres-network

volumes:
  mariadb_data:

networks:
  seatres-network:
    driver: bridge

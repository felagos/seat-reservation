version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seatres-postgres-dev
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seatres-network

  db-init:
    image: postgres:16-alpine
    container_name: seatres-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./init-db/init-demo.sql:/sql/init-demo.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "seatres", "-f", "/sql/init-demo.sql"]
    networks:
      - seatres-network

  redis:
    image: redis:7-alpine
    container_name: seatres-redis-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seatres-network

  backend-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: seatres-backend-1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_APPLICATION_NAME: seatreservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seatres-network

  backend-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: seatres-backend-2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_APPLICATION_NAME: seatreservation
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seatres-network

  nginx:
    image: nginx:1.27-alpine
    container_name: seatres-nginx-dev
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    networks:
      - seatres-network

volumes:
  postgres_data:

networks:
  seatres-network:
    driver: bridge
